// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Intercept app.notifee:core resolution: serve from the local AAR bundled inside
// the @notifee/react-native npm package to avoid a slow/unreachable JitPack request.
allprojects {
    def notifeeLibs = new File(rootDir, "../node_modules/@notifee/react-native/android/libs").toURI()
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'app.notifee' && details.requested.name == 'core') {
                details.useVersion '202108261754'
            }
        }
    }
    repositories {
        // Must be declared before JitPack so Gradle resolves app.notifee:core locally
        maven { url notifeeLibs }
    }
}
